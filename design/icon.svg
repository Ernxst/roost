<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#ebe1cc"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a92e12"/>
      <stop offset="0.45" stop-color="#cf4422"/>
      <stop offset="1" stop-color="#b8391a"/>
    </linearGradient>
    <linearGradient id="breast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f28c40"/>
      <stop offset="1" stop-color="#de6629"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2a1f10" flood-opacity="0.26"/>
    </filter>
    <filter id="soft" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5a3a1a" flood-opacity="0.25"/>
    </filter>
    <g id="robin">
      <path d="M440 488 L292 578 Q280 598 302 598 L462 548 Z"/>
      <ellipse cx="518" cy="482" rx="124" ry="90" transform="rotate(-16 518 482)"/>
      <circle cx="612" cy="392" r="66"/>
    </g>
    <!-- a clip path can't use a group, so it repeats the robin's shapes -->
    <clipPath id="bird">
      <path d="M440 488 L292 578 Q280 598 302 598 L462 548 Z"/>
      <ellipse cx="518" cy="482" rx="124" ry="90" transform="rotate(-16 518 482)"/>
      <circle cx="612" cy="392" r="66"/>
    </clipPath>
  </defs>

  <!-- the card -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#drop)"/>

  <!-- the bookmark centred on the card, the robin perched on top -->
  <g transform="translate(512 512) scale(1.1) translate(-522 -588)">
    <path d="M424 588 H620 V862 L522 806 L424 862 Z" fill="url(#ribbon)" filter="url(#soft)"/>

    <g stroke="#1d1a14" stroke-width="14" stroke-linecap="round">
      <line x1="500" y1="560" x2="494" y2="590"/>
      <line x1="546" y1="556" x2="552" y2="590"/>
    </g>
    <use href="#robin" fill="#1d1a14"/>
    <g clip-path="url(#bird)">
      <ellipse cx="634" cy="512" rx="94" ry="114" fill="url(#breast)"/>
    </g>
    <path d="M670 380 L730 402 L668 422 Z" fill="#e9a53a"/>
    <circle cx="626" cy="372" r="12" fill="#fbf7ee"/>
  </g>
</svg>
